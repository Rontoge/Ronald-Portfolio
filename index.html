<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-hidden dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronald Gaba | Frontend Developer</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));
</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
rel="stylesheet">

<style>
* {
font-family: 'Inter', sans-serif;
}

code, .code {
font-family: 'Fira Code', monospace;
}

:root {
--bg-light: #F8FAFC;
--text-primary-light: #0F172A;
--text-secondary-light: #475569;
--accent: #4F46E5;
--accent-hover: #4338CA;
--accent-soft: #A5B4FC;
--bg-dark: #020617;
--text-dark: #E5E7EB;
--accent-dark: #6366F1;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
width: 8px;
}

::-webkit-scrollbar-track {
background: var(--bg-light);
}

::-webkit-scrollbar-thumb {
background: var(--accent);
border-radius: 4px;
}

.dark ::-webkit-scrollbar-track {
background: var(--bg-dark);
}

.dark ::-webkit-scrollbar-thumb {
background: var(--accent-dark);
}

/* Animations */
@keyframes fadeInUp {
from {
opacity: 0;
transform: translateY(40px);
}

to {
opacity: 1;
transform: translateY(0);
}
}

.animate-fade-in-up {
animation: fadeInUp 0.8s ease-out forwards;
opacity: 0;
}

/* Disabled submit button */
#submit-btn:disabled {
cursor: not-allowed;
opacity: 0.7;
transform: none;
}
</style>
</head>

<body class="bg-[#020617] text-[#E5E7EB] min-h-screen flex items-center justify-center p-4">

<!-- Contact Form Container -->
<div class="w-full max-w-2xl bg-[#0b1329] p-8 rounded-2xl border border-slate-800 shadow-2xl animate-fade-in-up">

<h2 class="text-2xl font-bold mb-6 text-white tracking-tight flex items-center gap-2">
<i class="fa-solid fa-envelope text-indigo-500"></i>
Get In Touch
</h2>

<!-- Web3Forms Contact Form -->
<form
id="contact-form"
action="https://api.web3forms.com/submit"
method="POST"
class="space-y-5"
>

<!-- Replace with your real Web3Forms access key -->
<input
type="hidden"
name="access_key"
value="YOUR_ACCESS_KEY_HERE"
>

<!-- Name and Email -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">

<div class="flex flex-col gap-2">
<label for="name" class="text-sm font-semibold text-slate-400">
Your Name
</label>

<input
type="text"
id="name"
name="name"
placeholder="John Doe"
autocomplete="name"
required
class="w-full bg-[#020617] border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
>
</div>

<div class="flex flex-col gap-2">
<label for="email" class="text-sm font-semibold text-slate-400">
Your Email
</label>

<input
type="email"
id="email"
name="email"
placeholder="john@example.com"
autocomplete="email"
required
class="w-full bg-[#020617] border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
>
</div>

</div>

<!-- Subject -->
<div class="flex flex-col gap-2">
<label for="subject" class="text-sm font-semibold text-slate-400">
Subject
</label>

<input
type="text"
id="subject"
name="subject"
placeholder="Project Inquiry"
required
class="w-full bg-[#020617] border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
>
</div>

<!-- Message -->
<div class="flex flex-col gap-2">
<label for="message" class="text-sm font-semibold text-slate-400">
Message
</label>

<textarea
id="message"
name="message"
rows="5"
placeholder="Tell me about your project..."
required
class="w-full bg-[#020617] border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all resize-none"
></textarea>
</div>

<!-- Submit Button -->
<div class="pt-2">
<button
type="submit"
id="submit-btn"
class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3.5 px-6 rounded-xl transition-all duration-300 transform hover:-translate-y-0.5 flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-indigo-600/20"
>
<span id="button-text">Send Message</span>
<i id="button-icon" class="fa-solid fa-paper-plane text-sm"></i>
</button>
</div>

<!-- Accessible submission feedback -->
<div
id="form-result"
class="text-center font-medium text-sm mt-3"
role="status"
aria-live="polite"
></div>

</form>
</div>

<!-- Web3Forms Submission Logic -->
<script>
const form = document.getElementById('contact-form');
const result = document.getElementById('form-result');
const submitBtn = document.getElementById('submit-btn');
const buttonText = document.getElementById('button-text');
const buttonIcon = document.getElementById('button-icon');

form.addEventListener('submit', async function (event) {
event.preventDefault();

// Validate the access key before sending
const accessKey = form.querySelector(
'input[name="85e6bcfe-c5f5-4285-8566-b82d5fcaac31"]'
).value.trim();

if (!accessKey || accessKey === '85e6bcfe-c5f5-4285-8566-b82d5fcaac31') {
result.className =
'text-center font-medium text-sm mt-3 text-amber-400';

result.textContent =
'Please configure your Web3Forms access key before submitting.';

return;
}

// Prepare the form data
const formData = new FormData(form);

// Show loading state
submitBtn.disabled = true;
buttonText.textContent = 'Sending Message...';
buttonIcon.className =
'fa-solid fa-circle-notch fa-spin text-sm';

result.className =
'text-center font-medium text-sm mt-3 text-indigo-400';

result.innerHTML =
'<i class="fa-solid fa-circle-notch fa-spin"></i> Sending your message...';

try {
// Send the form to the correct Web3Forms API endpoint
const response = await fetch(
'https://api.web3forms.com/submit',
{
method: 'POST',
body: formData
}
);

const data = await response.json();

if (response.ok && data.success) {
result.className =
'text-center font-medium text-sm mt-3 text-emerald-400';

result.textContent =
'Success! Your message has been sent. Thank you for reaching out!';

form.reset();
} else {
result.className =
'text-center font-medium text-sm mt-3 text-rose-400';

result.textContent =
data.message ||
'Your message could not be sent. Please try again.';
}

} catch (error) {
console.error('Web3Forms submission error:', error);

result.className =
'text-center font-medium text-sm mt-3 text-rose-400';

result.textContent =
'Unable to connect. Please check your internet connection and try again.';

} finally {
// Restore the button whether the request succeeds or fails
submitBtn.disabled = false;
buttonText.textContent = 'Send Message';
buttonIcon.className =
'fa-solid fa-paper-plane text-sm';
}
});
</script>

</body>
</html>
